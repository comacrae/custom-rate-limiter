name: Checks

# Same checks as the pre-commit hooks, so commits made with --no-verify are still caught
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
