name: Supabase

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  push:
    branches: [develop, main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.105.0

      # Applies all migrations and seed.sql to a fresh Postgres
      - run: supabase db start

      - name: Lint schema
        run: supabase db lint --local --level warning --fail-on warning

      - name: Security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on warn

      - name: pgTAP tests
        run: supabase test db --local
