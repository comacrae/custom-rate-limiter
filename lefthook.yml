# https://lefthook.dev
# App lint and typecheck jobs get added back once the expense tracker app exists
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: gitleaks git --staged --redact --no-banner

    - name: format
      glob: '*.{js,jsx,ts,tsx,json,md,yml,yaml,css}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
